name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: overworld-portal-project/overworld-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: overworldportal-jar
          path: overworld-portal-project/overworld-portal/build/libs/*.jar
